spring.application.name=WastePickup

# MySQL - create the database first: CREATE DATABASE WastePickup;
spring.datasource.url=jdbc:mysql://localhost:3306/WastePickup?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Business rules
app.scoring.minimum-average=60
app.scoring.rolling-pickups=5
